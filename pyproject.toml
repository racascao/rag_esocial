[project]
name = "rag-esocial"
version = "0.1.0"
description = "Fundação do assistente RAG para documentação oficial do eSocial"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "pypdf>=5.0,<6", "rich>=13.9,<14", "sqlalchemy>=2.0,<3", "typer>=0.15,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
esocial = "rag_esocial.cli:app"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["rag_esocial*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
