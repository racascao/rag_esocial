      - SearchProjection: search_projection.md
      - Estrutura MOS: mos_structure.md
      - Estrutura Leiaute: layout_structure.md
      - Estrutura XSD: xsd_structure.md
      - Fatos determinísticos: deterministic_facts.md
      - Fact resolution: fact_resolution.md
      - Evidence assembly: evidence_assembly.md
      - Answer Contract: answer_contract.md
